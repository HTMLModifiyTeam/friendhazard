<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="description" content="인간들의 정신건강이 악화되어 정신건강한 사람이 희귀해진 근미래, 정신건강 0급인 나에게 사람들이 친구해 달라며 몰려온다.">
    <meta name="theme-color" content="#ffffff">
    <title>친구하자드</title>
    <link rel="icon" type="image/x-icon" href="/imgs/icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&family=Noto+Serif+KR:wght@400;700;900&display=swap">
    <link rel="stylesheet" href="styles/title/main.css">
    <link rel="stylesheet" href="styles/house/mod-menu.css">
    <script type="importmap">{"imports":{"three":"https://threejs.org/build/three.module.js"}}</script>
  </head>

  <body>
    <script type="module" src="js/title-boot.js"></script>

    <canvas id="c" aria-label="게임 화면"></canvas>
    <div id="ui">
      <div id="danger"></div>
      <div id="bubbles"></div>
      <div id="hud" hidden><span class="lbl">친구 요청 거절</span><b id="killN">0</b><span id="powerStatus" hidden></span></div>
      <div id="itemNotice" hidden role="status" aria-live="polite"></div>
      <div id="stick" hidden>
        <div class="base"></div>
        <div class="knob"></div>
      </div>
      <div id="hint" hidden>
        <div class="ring"></div>
        <div class="dot"></div>
        <div class="kb"><span>W</span><span>A</span><span>S</span><span>D</span></div>
      </div>
      <button id="weapon" hidden aria-label="무기">
        <svg class="gun" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M9 22h40l3-3h5v9h-4v4H32l-2 3h-6l-3 13a3 3 0 0 1-3 2.4h-6a2 2 0 0 1-2-2.5l4-14.4L9 30z" fill="#1f1a24" />
          <path d="M30 35h6l-1.6 6.2a2 2 0 0 1-2 1.5H29" fill="none" stroke="#1f1a24" stroke-width="3" stroke-linejoin="round" />
          <rect x="12" y="24.5" width="34" height="3" rx="1.5" fill="#fff" opacity=".35" />
        </svg>
        <svg class="knife" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M8 40c10-3 26-10 40-24l6-4-2 7C42 33 28 41 14 44z" fill="#fff" />
          <path d="M14 44l-4 2 4 9 5-2-1.5-7z" fill="#1f1a24" stroke="#fff" stroke-width="2.5" stroke-linejoin="round" />
          <path d="M12 41l8-3" stroke="#d3122c" stroke-width="1.6" />
        </svg>
        <svg class="sg" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M4 25h40l2-2h12v6H40l-4 2h-9l-2 2H15l-6 9H3l4-11z" fill="#1f1a24" />
          <rect x="27" y="29" width="13" height="5" rx="1.5" fill="#8a4f2a" />
          <rect x="8" y="26.5" width="34" height="2.4" rx="1.2" fill="#fff" opacity=".35" />
        </svg>
        <b id="sgN" hidden>0</b>
        <span class="keycap">SPACE</span>
      </button>
      <div id="arrow" hidden aria-hidden="true"><svg viewBox="0 0 48 48">
          <path d="M24 4 L44.5 26.5 H32.5 V44 H15.5 V26.5 H3.5 Z" fill="#f6c42f" stroke="#1f1a24" stroke-width="3.6" stroke-linejoin="round" />
          <path d="M24 10.5 L35 22.5" stroke="#fff6cc" stroke-width="2.6" stroke-linecap="round" opacity=".85" />
        </svg></div>
      <div id="toast" hidden role="status"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24">
            <circle cx="9.2" cy="8" r="3.6" fill="#fff" />
            <path d="M2.6 19c.5-3.9 3.2-6.1 6.6-6.1s6.1 2.2 6.6 6.1z" fill="#fff" />
            <path d="M19 6.6v7.2M15.4 10.2h7.2" stroke="#fff" stroke-width="2.3" stroke-linecap="round" />
          </svg></span><span class="msg">친구를 새로 사귀었습니다.</span><span class="tm">방금</span></div>
      <div id="rescueNotice" hidden role="status" aria-live="polite">친구를 구해 주세요.</div>
      <div id="sub" hidden></div>
      <div id="backHint" hidden role="status"></div>
      <div id="slam" hidden><span class="gold">친구하자드</span></div>
      <div id="flash"></div>
      <div id="linkFade"></div>

      <section id="intro" hidden>
        <div class="lines">
          <p></p>
          <p></p>
          <p></p>
        </div>
      </section>

      <div class="certwrap" id="certA" hidden>
        <article class="cert" aria-label="정신건강 등급 판정서">
          <h2>정신건강 등급 판정서</h2>
          <div class="no" id="certNoA">제 20XX-04417호</div>
          <dl>
            <dt>판정 등급</dt>
            <dd class="slot">
              <div class="stamp" id="stampA"><small>정신건강</small><b>0급</b></div>
            </dd>
            <dt>특이사항</dt>
            <dd>없음</dd>
          </dl>
          <p class="body">위 사람은 정신이 건강하므로 「특별관리 보호대상」으로 지정하나 해고함.</p>
          <div class="date" id="certDateA"></div>
          <div class="org"><span class="agency-mark" aria-hidden="true"></span><span>국가정신건강등급심사원</span></div>
        </article>
      </div>

      <section id="result" hidden>
        <div class="lbl">친구 요청 거절</div>
        <div class="num"><b id="endN">0</b><small>건</small></div>
        <button id="again" type="button">다시하기</button>
      </section>

      <section id="title">
        <h1 class="logo gold">친구하자드</h1>
        <button id="start" type="button" disabled>시작</button>
      </section>

      <button id="mute" class="iconbtn" type="button" aria-label="소리 끄기">
        <svg class="on" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9h4l5-4v14l-5-4H4z" fill="#1f1a24" />
          <path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#1f1a24" stroke-width="2"
            stroke-linecap="round" />
        </svg>
        <svg class="off" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9h4l5-4v14l-5-4H4z" fill="#1f1a24" />
          <path d="M16.5 9.5l5 5m0-5l-5 5" stroke="#1f1a24" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
      <section id="modMenu" class="mod-menu" hidden aria-label="Modifier menu">
        <header><strong>MOD MENU</strong><button id="modClose" type="button" aria-label="Close">×</button></header>
        <div class="mod-options">
          <label class="mod-toggle"><span>Infinite ammo</span><input id="modInfinite" type="checkbox"></label>
          <label class="mod-toggle"><span>No recoil</span><input id="modRecoil" type="checkbox"></label>
          <label class="mod-toggle"><span>Auto fire</span><input id="modAuto" type="checkbox"></label>
          <label class="mod-toggle"><span>Noclip</span><input id="modNoclip" type="checkbox"></label>
          <label class="mod-toggle"><span>All powerups · ∞ duration</span><input id="modAllPowers"
              type="checkbox"></label>
        </div>
        <button id="modRepel" class="mod-action" type="button">Push crowd away</button>
        <small>Press the backtick key to open or close</small>
      </section>
      <div id="err" hidden></div>
    </div>
    <script type="module" src="js/title.js"></script>
  </body>
</html>
